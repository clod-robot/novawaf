# NAC 前门（443/TLS）：除大文件下载外全量反代到 WAF:8099，
# 由 WAF 统一检测、限流并改写 Server 头为固定人格（全站指纹一致）。

# 每源 IP 并发连接上限（Slowloris 连接耗尽兜底：攻击者只能耗尽自己的配额）
limit_conn_zone $binary_remote_addr zone=nova_perip:10m;

server {
    listen 443 ssl;
    server_tokens off;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nac.crt;
    ssl_certificate_key /etc/nginx/ssl/nac.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 慢速攻击防护：头/体读取超时（Slowloris/SlowBody 在到达 WAF 前被切断）
    client_header_timeout 12s;
    client_body_timeout   12s;
    # 并发连接兜底：单 IP 超 32 并发直接 429（正常浏览器 6~8 连接，余量充足）
    limit_conn nova_perip 32;
    limit_conn_status 429;
    # 解析层/限流错误统一人格：nginx 直返页带 Server: nginx 真实指纹（无 headers_more
    # 可改写），劫持到 WAF 保留端点按全站人格渲染（每码硬编码，$status 在此不展开）
    error_page 400 = /__novawaf-err/400;
    error_page 404 = /__novawaf-err/404;
    error_page 408 = /__novawaf-err/408;
    error_page 413 = /__novawaf-err/413;
    error_page 414 = /__novawaf-err/414;
    error_page 429 = /__novawaf-err/429;
    error_page 494 = /__novawaf-err/494;
    error_page 495 = /__novawaf-err/495;
    error_page 496 = /__novawaf-err/496;
    error_page 497 = /__novawaf-err/497;
    # 头部上限放宽：让超限请求由 WAF 以统一人格输出 400/413，而非 nginx 原生错误页
    large_client_header_buffers 8 32k;
    # 体上限高于 WAF 侧阈值：413 由 WAF 统一输出固定人格
    client_max_body_size 200m;

    # 大文件下载：保持在 front 直接静态服务，避免大文件经 WAF 双向缓冲
    location ^~ /downloads/ {
        root /var/www/nac;
        try_files $uri =404;
    }

    # SSE：仪表盘实时监控流 —— 经 WAF 受防护透传（引擎流式双向中继，不缓冲断流）
    location /api/auth/monitor/stream {
        proxy_pass http://127.0.0.1:8099;
        proxy_pass_header Server;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;  # 请求头到达即转发，Slow POST 由 WAF 15s 绝对上限切断
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host nac;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # 客户端伪造的原始头单独透传给 WAF 检测（本层 XFF 已覆盖为真实来源）
        proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Original-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 全量反代到 WAF（含静态页/API/WebSocket），由 WAF 转发至 inner:18082
    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_pass_header Server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_buffering off;
        # 请求体不缓冲：默认(on)下 nginx 会收完整 body 才转发，Slow POST 滴灌永不触发
        # 间隔超时也永不到达 WAF；关闭后头部即刻到达 WAF 开始 15s 绝对计时，滴灌必被切断
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_set_header Host nac;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        # 客户端伪造的原始头单独透传给 WAF 检测（本层 XFF 已覆盖为真实来源）
        proxy_set_header X-Original-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Original-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
