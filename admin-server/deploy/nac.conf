server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/nac.crt;
    ssl_certificate_key /etc/nginx/ssl/nac.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    # 根路径及任意未匹配路径一律跳到应用入口
    location ^~ /downloads/ {
        root /var/www/nac;
        try_files $uri =404;
    }
    location / {
        return 301 /nac/;
    }
    location = /nac {
        return 301 /nac/;
    }

    # WebSocket：远程终端，反代到 nac-auth（8081），开启 Upgrade
    location /ws/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端入口 HTML：每次都校验，避免更新后浏览器仍用旧页面
    location = /nac/index.html {
        root /var/www;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # 带 hash 的静态资源：内容不变即可长期缓存
    location ^~ /nac/assets/ {
        root /var/www;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    location /nac/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /nac/index.html;
    }

    # SSE：仪表盘实时监控流 —— 经 WAF(8099) 受防护透传（引擎已支持流式双向中继，不缓冲断流）
    location /api/auth/monitor/stream {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host nac;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API 反代：先过 WAF(8099) 再到 nac-gateway，Host 固定为 nac 以匹配 WAF 应用
    location /api/ {
        proxy_pass http://127.0.0.1:8099;
        proxy_set_header Host nac;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
