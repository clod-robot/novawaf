# NAC 内层站点（仅监听回环，由 WAF:8099 转发至此）
# 架构：client -> front:443(TLS) -> WAF:8099 -> inner:18082 -> {静态 /var/www, /api/ -> gateway:8080, /ws/ -> auth:8081}
# Server 头由 WAF 统一改写为固定人格，此处 server_tokens off 仅作兜底。
server {
    listen 127.0.0.1:18082;
    server_tokens off;
    server_name _;

    client_max_body_size 200m;
    # 重定向输出相对 Location：避免把内部 Host(nac)/端口(18082) 泄露给客户端
    absolute_redirect off;

    # 根路径及未匹配路径一律跳到应用入口
    location = / {
        return 301 /nac/;
    }
    location = /nac {
        return 301 /nac/;
    }

    # WebSocket：远程终端，反代到 nac-auth（8081），开启 Upgrade。
    # 客户端真实 IP 经 front->WAF 透传在 X-Real-IP/X-Forwarded-For，继续向下游传播。
    location /ws/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端入口 HTML：每次都校验，避免更新后浏览器仍用旧页面
    location = /nac/index.html {
        root /var/www;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # 带 hash 的静态资源：内容不变即可长期缓存
    location ^~ /nac/assets/ {
        root /var/www;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
    }

    location /nac/ {
        root /var/www;
        index index.html;
        # SPA 入口不缓存：避免前端更新后浏览器仍用旧页面（带 hash 的 assets 另有 immutable 缓存）
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /nac/index.html;
    }

    # SSE：仪表盘实时监控流 —— 不缓冲，直接透传事件块
    location /api/auth/monitor/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    # 后端 API 反代到 nac-gateway
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    # 其余路径跳应用入口
    location / {
        return 301 /nac/;
    }
}
