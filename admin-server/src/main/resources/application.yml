server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: novawaf-admin
  datasource:
    url: jdbc:mysql://${NOVA_MYSQL_HOST:127.0.0.1}:${NOVA_MYSQL_PORT:3306}/${NOVA_MYSQL_DB:novawaf_admin}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${NOVA_MYSQL_USER:novawaf}
    password: ${NOVA_MYSQL_PASSWORD:CHANGE-ME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: ${NOVA_REDIS_HOST:127.0.0.1}
      port: ${NOVA_REDIS_PORT:6379}
      password: ${NOVA_REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

mybatis:
  configuration:
    map-underscore-to-camel-case: true

# 业务配置
nova:
  jwt:
    # 生产必须用环境变量覆盖: NOVA_JWT_SECRET
    secret: ${NOVA_JWT_SECRET:CHANGE-ME-please-set-NOVA_JWT_SECRET-at-least-32-chars}
    expire-minutes: 120
  admin:
    # 启动时若 admin 密码哈希不符则重置为此密码(仅首次/哈希不一致时生效)
    init-password: ${NOVA_ADMIN_PASSWORD:Admin@2026}
  security:
    # 登录防爆破: IP 5次/5分钟 锁15分钟; 账号 10次/5分钟 锁30分钟
    ip-fail-max: 5
    ip-lock-minutes: 15
    acct-fail-max: 10
    acct-lock-minutes: 30
  cors:
    allowed-origins: ${NOVA_CORS:*}
  deploy:
    # 后台“一键探测”调起的 NAT 探测脚本固定绝对路径(无 shell、带超时、输出封顶)；留空则禁用一键探测
    detect-script: ${NOVA_DETECT_SCRIPT:/opt/novawaf/scripts/detect_nat.py}
    detect-timeout-ms: 10000
  ipgroup:
    # 威胁情报收集器（12 个公开源汇总，支持 -o 输出文件）与自定义源拉取脚本；均固定 argv 受控执行
    threat-script: ${NOVA_THREAT_SCRIPT:/opt/novawaf/scripts/collect_malicious_ips.py}
    fetch-script: ${NOVA_FETCH_IP_SCRIPT:/opt/novawaf/scripts/fetch_ip_list.py}
    fetch-timeout-ms: 120000
    threat-timeout-ms: 300000

logging:
  level:
    com.novawaf: INFO
