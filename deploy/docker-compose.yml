version: "3.8"
# NovaWAF 一键编排：检测引擎 + 管理后台 + Nginx 网关
services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    container_name: novawaf-engine
    ports:
      - "8080:8080"
    restart: unless-stopped
    ulimits:
      nofile: 655350

  management:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mgt
    container_name: novawaf-mgt
    ports:
      - "9000:9000"
    depends_on:
      - engine
    restart: unless-stopped

  nginx:
    image: nginx:1.25
    container_name: novawaf-gateway
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - engine
    restart: unless-stopped
